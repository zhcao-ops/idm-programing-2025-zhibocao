  <head>

    <style>
      :root {
        color-scheme: dark;
        --bg: #10100f;
        --paper: #f7f6f2;
        --ink: #10100f;
        --text: #f7f6f2;
        --muted: rgba(247, 246, 242, 0.62);
        --line: rgba(247, 246, 242, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      .page {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .hero {
        border-bottom: 1px solid var(--line);
        padding-bottom: 40px;
      }

      .hero-grid {
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: rgba(247, 246, 242, 0.45);
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 760px;
        font-size: clamp(42px, 7vw, 96px);
        line-height: 1.02;
        font-weight: 650;
      }

      .subtitle {
        max-width: 680px;
        margin-top: 20px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }

      .intro-panel {
        display: flex;
        max-width: 560px;
        flex-direction: column;
        gap: 24px;
      }

      .toggle {
        display: inline-flex;
        width: max-content;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px;
      }

      .toggle button {
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(247, 246, 242, 0.58);
        padding: 8px 16px;
        transition: 180ms ease;
      }

      .toggle button.active {
        background: var(--paper);
        color: var(--ink);
      }

      .intro {
        color: rgba(247, 246, 242, 0.56);
        font-size: 14px;
        line-height: 2;
      }

      .jump-list {
        display: grid;
        gap: 12px;
        margin-top: 40px;
      }

      .jump {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid rgba(247, 246, 242, 0.1);
        background: rgba(255, 255, 255, 0.03);
        padding: 14px 16px;
        color: rgba(247, 246, 242, 0.72);
        font-size: 14px;
        transition: 180ms ease;
      }

      .jump:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .jump-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .jump-id {
        color: rgba(247, 246, 242, 0.35);
      }

      main {
        border-top: 0;
      }

      .project {
        display: grid;
        gap: 40px;
        border-bottom: 1px solid var(--line);
        padding: 56px 0;
      }

      .project:last-child {
        border-bottom: 0;
      }

      .visual-meta {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .source {
        margin-bottom: 8px;
        color: rgba(247, 246, 242, 0.34);
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .visual-label {
        color: rgba(247, 246, 242, 0.7);
        font-size: 14px;
      }

      .project-id {
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        padding: 6px 12px;
        color: rgba(247, 246, 242, 0.72);
        font-size: 12px;
      }

      .visual-board {
        border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
        background: rgba(255, 255, 255, 0.035);
        padding: 12px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
      }

      .main-image {
        overflow: hidden;
        background: #171615;
      }

      .main-image.scene {
        aspect-ratio: 16 / 9;
      }

      .main-image.document {
        aspect-ratio: 4 / 3;
      }

      .main-image img,
      .detail-image img {
        display: block;
        width: 100%;
        height: 100%;
        transition: transform 500ms ease;
      }

      .main-image:hover img,
      .detail-image:hover img {
        transform: scale(1.015);
      }

      .scene img {
        object-fit: cover;
      }

      .document img {
        object-fit: contain;
        padding: 16px;
      }

      .image-row {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .detail-image {
        min-height: 220px;
        overflow: hidden;
        background: #171615;
      }

      .image-row.with-gallery .focus-card {
        min-height: 180px;
      }

      .focus-card {
        display: flex;
        min-height: 220px;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid var(--accent);
        background: var(--paper);
        color: var(--ink);
        padding: 20px;
      }

      .focus-card .label {
        color: rgba(16, 16, 15, 0.45);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .focus-card p {
        margin-top: 32px;
        color: rgba(16, 16, 15, 0.72);
        font-size: 14px;
        line-height: 1.9;
      }

      .accent-bar {
        display: block;
        width: 64px;
        height: 4px;
        margin-top: 24px;
        background: var(--accent);
      }

      .content {
        min-width: 0;
      }

      .type-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .type-row .dot {
        width: 12px;
        height: 12px;
      }

      .type {
        color: rgba(247, 246, 242, 0.38);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h2 {
        font-size: clamp(32px, 4vw, 56px);
        line-height: 1.1;
        font-weight: 650;
      }

      .project-subtitle {
        margin-top: 16px;
        color: rgba(247, 246, 242, 0.45);
        font-size: 14px;
        line-height: 1.9;
      }

      .overview {
        max-width: 760px;
        margin-top: 28px;
        color: rgba(247, 246, 242, 0.72);
        font-size: 18px;
        line-height: 1.85;
      }

      .project-link {
        display: inline-flex;
        gap: 8px;
        margin-top: 28px;
        border-bottom: 1px solid rgba(247, 246, 242, 0.6);
        padding-bottom: 4px;
        color: var(--text);
        font-size: 14px;
        transition: 180ms ease;
      }

      .project-link:hover {
        border-color: var(--text);
        color: rgba(247, 246, 242, 0.72);
      }

      .columns {
        display: grid;
        gap: 32px;
        margin-top: 40px;
      }

      h3 {
        margin-bottom: 20px;
        color: rgba(247, 246, 242, 0.38);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .line-list {
        display: grid;
        gap: 16px;
      }

      .line-list p {
        border-left: 1px solid rgba(247, 246, 242, 0.14);
        padding-left: 16px;
        color: rgba(247, 246, 242, 0.68);
        font-size: 14px;
        line-height: 2;
      }

      .line-list.contribution p {
        border-left-color: color-mix(in srgb, var(--accent) 45%, transparent);
      }

      .keywords {
        margin-top: 40px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tag {
        border: 1px solid rgba(247, 246, 242, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        padding: 8px 16px;
        color: rgba(247, 246, 242, 0.7);
        font-size: 14px;
      }

      @media (min-width: 760px) {
        .page {
          padding: 40px 40px 56px;
        }

        .hero {
          padding-bottom: 56px;
        }

        .jump-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .image-row {
          grid-template-columns: 0.58fr 0.42fr;
        }

        .image-row.with-gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .image-row.with-gallery .focus-card {
          grid-column: 1 / -1;
        }

        .columns {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1060px) {
        .hero-grid {
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;
        }

        .intro-panel {
          align-items: flex-end;
        }

        .intro {
          text-align: right;
        }

        .project {
          grid-template-columns: minmax(0, 0.98fr) minmax(0, 1.02fr);
          gap: 56px;
          padding: 80px 0;
        }

        .project.reversed .visual {
          order: 2;
        }

        .project.reversed .content {
          order: 1;
        }
      }
    </style>
  </head>

            en: "An arcade reading of rhythm, feedback, and resource pressure, asking why a simple loop stays compelling."
          }
        }
      };

      let lang = "zh";

      function setText() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = copy[lang][el.dataset.i18n];
        });
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === lang);
        });
      }

      function render() {
        setText();
        const jumpList = document.getElementById("jumpList");
        const projects = document.getElementById("projects");
        jumpList.innerHTML = "";
        projects.innerHTML = "";

        copy[lang].projects.forEach((project, index) => {
          const visual = visuals[project.id];
          const [sourceLabel, visualLabel] = visual[lang];
          const extraImage = visual.images[2]
            ? `
                  <div class="detail-image ${visual.mode}">
                    <img src="${visual.images[2]}" alt="${project.title} scene" loading="lazy" />
                  </div>
                `
            : "";

          const jump = document.createElement("a");
          jump.className = "jump";
          jump.href = `#project-${project.id}`;
          jump.style.setProperty("--accent", visual.accent);
          jump.innerHTML = `
            <span class="jump-title"><span class="dot"></span><span>${project.title}</span></span>
            <span class="jump-id">${project.id}</span>
          `;
          jumpList.appendChild(jump);

          const section = document.createElement("section");
          section.id = `project-${project.id}`;
          section.className = `project ${index % 2 === 1 ? "reversed" : ""}`;
          section.style.setProperty("--accent", visual.accent);
          section.innerHTML = `
            <div class="visual">
              <div class="visual-meta">
                <div>
                  <p class="source">${sourceLabel}</p>
                  <p class="visual-label">${visualLabel}</p>
                </div>
                <span class="project-id">${project.id}</span>
              </div>
              <div class="visual-board">
                <div class="main-image ${visual.mode}">
                  <img src="${visual.images[0]}" alt="${project.title}" loading="lazy" />
                </div>
                <div class="image-row ${visual.images[2] ? "with-gallery" : ""}">
                  <div class="detail-image ${visual.mode}">
                    <img src="${visual.images[1]}" alt="${project.title} detail" loading="lazy" />
                  </div>
                  ${extraImage}
                  <div class="focus-card">
                    <div>
                      <span class="label">Project Focus</span>
                      <p>${visual.focus[lang]}</p>
                    </div>
                    <span class="accent-bar"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="content">
              <div class="type-row">
                <span class="dot"></span>
                <span class="type">${project.type}</span>
              </div>
              <h2>${project.title}</h2>
              <p class="project-subtitle">${project.subtitle}</p>
              <p class="overview">${project.overview}</p>
              ${
                project.link
                  ? `<a class="project-link" href="${project.link}" target="_blank" rel="noreferrer">${copy[lang].viewLink} ↗</a>`
                  : ""
              }
              <div class="columns">
                <div>
                  <h3>${copy[lang].contribution}</h3>
                  <div class="line-list contribution">
                    ${project.contribution.map((item) => `<p>${item}</p>`).join("")}
                  </div>
                </div>
                <div>
                  <h3>${copy[lang].highlights}</h3>
                  <div class="line-list">
                    ${project.highlights.map((item) => `<p>${item}</p>`).join("")}
                  </div>
                </div>
              </div>
              <div class="keywords">
                <h3>${copy[lang].keywords}</h3>
                <div class="tags">
                  ${project.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}
                </div>
              </div>
            </div>
          `;
          projects.appendChild(section);
        });
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => {
          lang = button.dataset.lang;
          render();
        });
      });

      render();
    </script>
  </body>
</html>
